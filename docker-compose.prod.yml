services:
  mobissh:
    build: .
    image: mobissh:${TAG:-latest}
    container_name: mobissh-prod
    restart: unless-stopped
    networks:
      - mobissh
    environment:
      PORT: "8081"
      NODE_ENV: production
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_HOSTNAME: "${TS_HOSTNAME:-mobissh}"
      TS_SERVE: "1"
      TS_SERVE_PORT: "${TS_SERVE_PORT:-443}"
      # #997: upload/telemetry routes proxy to the dedicated feedback service
      # (fail-open: LOCAL handling if it's unreachable, so a report is never
      # lost). ${VAR-default} (no colon) so an explicitly EMPTY env var
      # disables the proxy entirely. Takes effect on container recreate only —
      # cutover is an explicit `container-ctl.sh restart` after
      # `feedback-ctl.sh start` (see docs/feedback-service.md).
      FEEDBACK_SERVICE_URL: "${FEEDBACK_SERVICE_URL-http://mobissh-feedback:8082}"
      # #1115 fail-closed upload auth: container-ctl.sh exports this from
      # ~/.mobissh/feedback.env. Unset ⇒ the guard 503s all uploads.
      MOBISSH_FEEDBACK_KEY: "${MOBISSH_FEEDBACK_KEY:-}"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /var/lib/docker/volumes/dev_workspace/_data/mobissh/test-results/uploads:/app/test-results/uploads
      # Persistent native APK + install-page dir (#700). Survives container
      # recreate and the public/ hot-push; scripts/native-release-apk.sh writes
      # here and server/index.js serves the native artifact names from it.
      - /var/lib/docker/volumes/dev_workspace/_data/mobissh/native-dist:/app/native-dist
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun

networks:
  mobissh:
    name: mobissh
    external: true

volumes:
  tailscale-state:
    name: mobissh-tailscale-state
    external: true
