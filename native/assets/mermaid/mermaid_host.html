<!DOCTYPE html>
<!--
  Offline mermaid render host for the native markdown viewer (#942, #944).

  Loaded into a WebView via controller.loadFlutterAsset(); mermaid.min.js is a
  sibling Flutter asset (relative <script src> resolves under the asset base
  URL). NO network is ever touched. The Dart side calls window.renderMermaid()
  with the fenced-block source after onPageFinished; the page renders the SVG,
  measures it, and posts {type:'size'|'error'} back over the MermaidChannel.

  Pinch-zoom + pan come from the Android WebView's built-in zoom (enabled by
  default in webview_flutter_android) plus user-scalable=yes here.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=8.0, user-scalable=yes"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      #diagram {
        padding: 8px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
      }
      #diagram svg {
        max-width: 100%;
        height: auto;
      }
    </style>
    <script src="mermaid.min.js"></script>
  </head>
  <body>
    <div id="diagram"></div>
    <script>
      function post(payload) {
        try {
          if (window.MermaidChannel && window.MermaidChannel.postMessage) {
            window.MermaidChannel.postMessage(JSON.stringify(payload));
          }
        } catch (e) {
          /* channel not attached (e.g. preview) — ignore */
        }
      }

      var mermaidReady = false;
      try {
        if (window.mermaid) {
          window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
          mermaidReady = true;
        }
      } catch (e) {
        post({ type: 'error', message: 'mermaid init failed: ' + e });
      }

      function reportSize() {
        var el = document.getElementById('diagram');
        var h = Math.ceil(el.getBoundingClientRect().height);
        if (h > 0) post({ type: 'size', height: h });
      }

      // Called from Dart with the raw fenced-block source.
      window.renderMermaid = function (source) {
        var target = document.getElementById('diagram');
        if (!mermaidReady || !window.mermaid) {
          post({ type: 'error', message: 'mermaid unavailable' });
          return;
        }
        try {
          window.mermaid
            .render('mermaidGraph', source)
            .then(function (result) {
              target.innerHTML = result.svg;
              reportSize();
              // Re-measure after layout settles (fonts/labels).
              setTimeout(reportSize, 60);
            })
            .catch(function (err) {
              post({ type: 'error', message: String(err && err.message ? err.message : err) });
            });
        } catch (err) {
          post({ type: 'error', message: String(err && err.message ? err.message : err) });
        }
      };
    </script>
  </body>
</html>
