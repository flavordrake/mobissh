<!DOCTYPE html>
<!--
  Offline mermaid render host for the native markdown viewer (#942, #944).

  Loaded into a WebView via controller.loadFlutterAsset(); mermaid.min.js is a
  sibling Flutter asset (relative <script src> resolves under the asset base
  URL). NO network is ever touched. The Dart side calls window.renderMermaid()
  with the fenced-block source after onPageFinished; the page renders the SVG,
  measures it, and posts {type:'size'|'error'} back over the MermaidChannel.

  Pinch-zoom + pan come from the Android WebView's built-in zoom (enabled by
  default in webview_flutter_android) plus user-scalable=yes here.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Strict CSP is the egress block (#1107 sibling). Diagram source can come
      from untrusted content; mermaid's own securityLevel:'strict' sanitizes
      labels but enforces NO network policy on its own. default-src/connect-src
      'none' + img/font restricted to data:/self mean a mermaid-label injection
      can never beacon out. script-src 'self' runs our BUNDLED mermaid.min.js +
      mermaid_boot.js (both local assets) — the inline boot block was moved to
      mermaid_boot.js so no 'unsafe-inline' is needed for scripts. style-src
      keeps 'unsafe-inline' for the inline <style> and mermaid's generated SVG
      styling.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline' 'self'; img-src data:; font-src data: 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=8.0, user-scalable=yes"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      /* Centre the diagram BOTH ways. Inline, the WebView is sized to the
         diagram height so min-height:100vh == that height (no change). In the
         fullscreen fill viewer (#949) the WebView fills the screen, so this
         vertically centres the diagram instead of pinning it to the top with a
         void below. */
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #diagram {
        padding: 8px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        width: 100%;
      }
      #diagram svg {
        max-width: 100%;
        height: auto;
      }
    </style>
    <script src="mermaid.min.js"></script>
  </head>
  <body>
    <div id="diagram"></div>
    <!-- Boot logic externalized so a strict `script-src 'self'` (no
         'unsafe-inline') still runs it. -->
    <script src="mermaid_boot.js"></script>
  </body>
</html>
