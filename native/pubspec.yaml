name: mobissh
description: "Native Android client for MobiSSH — Flutter port of the PWA, escaping browser-tab lifecycle (#501)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.9+17

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — chosen 2026-05-21 (#501 decisions)
  flutter_riverpod: ^2.6.1

  # SSH client (terminal.studio, full -L/-R/-D support)
  dartssh2: ^2.17.1

  # Terminal widget (terminal.studio, same publisher as dartssh2)
  xterm: ^4.0.0

  # Opt-in ALTERNATE terminal backend (#684, #582): flterm = Flutter terminal
  # widget on libghostty-vt. Adopted (decided #582) for native touch
  # drag-select + copy — xterm.dart v4 has no selection-extend API. xterm stays
  # the DEFAULT; ghostty is selected via Settings > Terminal engine
  # (restart-to-apply). Pulls libghostty (prebuilt native .so via Dart build
  # hooks — Android builds with no extra toolchain, proven by spike PR #683).
  # Pinned exact (0.0.3 / libghostty) — beta API surface (reference_terminal_
  # widget_selection memory).
  flterm: 0.0.3

  # OS-backed credential vault — replaces PWA's PBKDF2+WebAuthn dance
  flutter_secure_storage: ^9.2.2

  # Biometric unlock — replaces PasswordCredential gymnastics
  local_auth: ^2.3.0

  # Foreground service for persistent SSH session (escape Android Doze + tab
  # lifecycle). Phase-4 plumbing; pinned now so analyzer sees the import.
  flutter_foreground_task: ^9.2.2

  # Persist profile list, settings; small JSON blobs only
  shared_preferences: ^2.3.5

  # PBKDF2-HMAC-SHA256 + AES-GCM-256 for vault decryption parity with the
  # PWA's WebCrypto vault (#510). Pure-Dart; no platform channel; runs in
  # flutter_test without a device.
  cryptography: ^2.7.0

  # In-app PDF viewer (#557). pdfium-backed, maintained, null-safe. Renders the
  # SFTP-fetched temp PDF in the file explorer's preview route.
  pdfrx: ^1.0.0

  # Open detected terminal URLs in the system browser (#570 "copy & navigate
  # URLs"). launchUrl(..., LaunchMode.externalApplication). Needs the Android
  # <queries> https intent in AndroidManifest to resolve a browser (added).
  url_launcher: ^6.3.0

  # Crash telemetry pipeline (#501 crash-on-launch).
  # http: bridge upload. path_provider: app-docs dir shared with the Kotlin
  # crash writer. device_info_plus + package_info_plus: enrich crash JSON.
  # share_plus: in-app "Share crash report" backup path.
  http: ^1.2.2
  path_provider: ^2.1.5
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Deterministic virtual clock for timer-lifecycle unit tests (#731
  # re-handshake timeout guard + #732 keybar auto-repeat). Already transitive via
  # flutter_test; declared directly so the explicit `package:fake_async` import
  # is lint-clean (depend_on_referenced_packages).
  fake_async: ^1.3.1

  # On-emulator acceptance: drives the real app (real foreground-task isolate,
  # real platform channels) against test-sshd. Catches bootstrap/IPC bugs the
  # InMemoryGatewayPair-based widget tests can't see (#539). Run via
  # scripts/native-connect-test.sh.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the Android launcher icon set from the MobiSSH PWA icon (#657).
  # Source is public/icon-512.png copied to assets/icon/mobissh_icon.png.
  # Regenerate with: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# flutter_launcher_icons config (#657). Replaces the default Flutter blue
# launcher icon with the MobiSSH PWA icon (pager showing "SSh" on a green LCD,
# white backdrop). adaptive_icon_background is white to match the icon's own
# backdrop so the pager stays centered with safe-zone padding on Android 8+.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/mobissh_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/mobissh_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled terminal fonts (#552, #679). The three monospace families the PWA
  # terminal offers (src/modules/terminal.ts FONT_FAMILIES), vendored under
  # assets/fonts/ (each OFL-1.1, license alongside). The per-session
  # font-family selector (#679) picks one; applied to the xterm TerminalView
  # via TerminalStyle(fontFamily: <family>). Regular + Bold per family so bold
  # SGR attributes render with a real bold face instead of synthetic faux-bold.
  #   - JetBrainsMono (OFL.txt) — default, was the only bundled face pre-#679.
  #   - FiraCode (FiraCode-OFL.txt) — tonsky/FiraCode v6.2 ttf/.
  #   - CascadiaCode (CascadiaCode-OFL.txt) — microsoft/cascadia-code v2407.24
  #     CascadiaMono static ttf (the no-ligature mono cut, truest terminal face;
  #     registered as family `CascadiaCode` to match the picker family id).
  #   - RobotoMono (RobotoMono-OFL.txt, OFL-1.1) — googlefonts/RobotoMono
  #     fonts/ttf/ static Regular+Bold (#707).
  #   - UbuntuMono (UbuntuMono-UFL.txt, Ubuntu Font Licence 1.0) — google/fonts
  #     ufl/ubuntumono static Regular+Bold (#707).
  #   - Cousine (Cousine-OFL.txt, OFL-1.1) — google/fonts ofl/cousine static
  #     Regular+Bold (#707). (Iosevka deferred — needs a custom build.)
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
        - asset: assets/fonts/FiraCode-Bold.ttf
          weight: 700
    - family: CascadiaCode
      fonts:
        - asset: assets/fonts/CascadiaMono-Regular.ttf
        - asset: assets/fonts/CascadiaMono-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
    - family: UbuntuMono
      fonts:
        - asset: assets/fonts/UbuntuMono-Regular.ttf
        - asset: assets/fonts/UbuntuMono-Bold.ttf
          weight: 700
    - family: Cousine
      fonts:
        - asset: assets/fonts/Cousine-Regular.ttf
        - asset: assets/fonts/Cousine-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
