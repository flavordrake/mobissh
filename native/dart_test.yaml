# Test runner config.
#
# The `integration` tag flags tests that need a real SSH server (test-sshd).
# The `scripts/native-fast-gate.sh` excludes this tag so the fast loop stays
# offline. Opt in explicitly with `flutter test --tags integration`.
tags:
  integration:
  # `ffi` flags headless tests that load the real libghostty .so on the host VM
  # (e.g. the replay-based URL-detection acceptance test). NOT excluded by the
  # fast gate — they run on every commit. The fork (third_party/flterm) uses the
  # same tag for its detection tests.
  ffi:
