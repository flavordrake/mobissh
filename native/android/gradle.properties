# -Xmx4G (was 8G): this host has 15G total RAM; an 8G Gradle daemon left no room
# for the Android emulator (~4G), OOM-killing it (exit 139) whenever an
# integration suite or agent build ran alongside a live emulator. 4G fits
# assembleDebug/assembleRelease here and leaves the emulator room. See memory
# reference_native_emulator_boot_troubleshooting.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# daemon off: on this 15G host a daemon stays resident at 4G after each build, so
# a second build + the live emulator stacked past 15G → emulator OOM (exit 139).
# Disabling it frees the build heap immediately after each build, leaving room
# for the emulator across back-to-back integration runs. Trades a little JVM
# startup time for memory safety.
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
