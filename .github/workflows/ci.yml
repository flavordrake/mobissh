name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd server && npm ci
      - name: ESLint
        run: npx eslint server/ server-feedback/ public/ test/

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Semgrep (custom + community rules)
        run: semgrep --config .semgrep/rules.yml --config p/javascript server/ server-feedback/ public/ --no-git-ignore --error --severity WARNING

  # #1205: this job used to run the PWA's Playwright suite — the repo's only CI.
  # The PWA is retired, so it runs the native gate instead: the bash rule tests +
  # the relocated infra tests (scripts/test-infra.sh) + flutter analyze + the
  # flutter unit suite. A CI job that no longer guards anything is worse than none.
  # The on-emulator integration tier is NOT here — it needs a leased device
  # (scripts/with-fleet-emulator.sh) and runs on fd-dev.
  native-gate:
    runs-on: ubuntu-latest
    needs: [lint, semgrep]
    env:
      # flutter-cmd.sh defaults XDG_CONFIG_HOME to a path under /home/dev that
      # only exists on fd-dev; point it at the runner's workspace instead.
      XDG_CONFIG_HOME: ${{ github.workspace }}/.flutter-config
      # disk-guard reclaims build output below 20G free; a GitHub runner is
      # always below that and has nothing of ours to reclaim.
      DISK_GUARD_SKIP: '1'
      # scripts/trace-github-search.sh is exercised by the infra tests.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the trace-history infra tests read real git history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Native fast gate
        run: scripts/native-fast-gate.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-fast-gate-log
          path: /tmp/mobissh/logs/native-fast-gate.log
          retention-days: 7
